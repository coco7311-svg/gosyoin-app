<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>御書印マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root { --bg:#faf7f2; --fg:#2b2622; --accent:#b3392f; --line:#e2dbd0; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; background:var(--accent); color:#fff; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
  header h1 { margin:0; font-size:1.1rem; }
  main { flex:1; display:flex; min-height:0; }
  #side { width:340px; max-width:45%; overflow-y:auto; border-right:1px solid var(--line); padding:10px; }
  #map { flex:1; }
  .filters { display:flex; gap:6px; margin-bottom:8px; }
  .filters button { flex:1; padding:6px; border:1px solid var(--line); background:var(--card); border-radius:6px; cursor:pointer; }
  .filters button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #pref { width:100%; padding:7px; margin-bottom:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); font-size:1rem; }
  .store { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px; display:flex; gap:8px; align-items:flex-start; }
  .store.done { background:#eef6ee; }
  .store input { margin-top:4px; width:18px; height:18px; accent-color:var(--accent); }
  .store .info { flex:1; cursor:pointer; }
  .store .name { font-weight:bold; }
  .store .addr { font-size:.8rem; color:#6b645c; }
  .store .date { font-size:.75rem; color:var(--accent); }
  header { position:relative; }
  .hr { display:flex; align-items:center; gap:10px; }
  #menu-btn { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.6); border-radius:6px; font-size:1.3rem; line-height:1; padding:4px 10px; cursor:pointer; }
  #menu { position:fixed; top:52px; right:8px; z-index:2000; width:min(340px, calc(100vw - 16px)); max-height:calc(100vh - 64px); overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.25); padding:6px 14px 12px; font-size:.85rem; }
  #menu[hidden] { display:none; }
  #menu h2 { font-size:.95rem; margin:12px 0 4px; }
  #menu p { margin:4px 0 8px; color:#6b645c; }
  #menu input:not([hidden]) { width:100%; margin:3px 0; padding:7px; font-size:1rem; }
  #menu button { padding:7px 12px; margin-right:4px; }
  .pin { width:22px; height:22px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .pin.todo { background:#888; } .pin.done { background:var(--accent); }
  @media (max-width:700px) { main { flex-direction:column-reverse; } #side { width:100%; max-width:none; height:45%; border-right:0; } }
</style>
</head>
<body>
<header>
  <h1>📖 御書印マップ</h1>
  <div class="hr"><span id="count"></span><button id="menu-btn" aria-label="メニュー" aria-expanded="false" aria-controls="menu">☰</button></div>
</header>
<div id="menu" hidden>
  <section>
    <h2>バックアップ</h2>
    <p>ブラウザのデータを消すと記録も消えます。時々「書き出し」でファイルに保存しておくと、「読み込み」で復元できます。</p>
    <button id="export">書き出し</button>
    <button id="import">読み込み</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </section>
  <section>
    <h2>書店を追加（CSV）</h2>
    <p>1行目に「書店名,住所,緯度,経度」の見出しを付けたCSVを選びます。緯度・経度が空の行は、住所から自動で探します（住所が必要です）。</p>
    <button id="csv-btn">CSVを選ぶ</button>
    <a href="#" id="csv-tpl">ひな形をダウンロード</a>
    <input type="file" id="csv-file" accept=".csv,text/csv" hidden>
    <p id="csv-status" role="status"></p>
  </section>
</div>
<main>
  <div id="side">
    <div class="filters">
      <button data-f="all" class="on">すべて</button>
      <button data-f="todo">未取得</button>
      <button data-f="done">取得済み</button>
    </div>
    <select id="pref" aria-label="都道府県"></select>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="stores.js"></script>
<script>
const KEY_CHECK = "goshoin.checked", KEY_EXTRA = "goshoin.extra";
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let checked = load(KEY_CHECK, {});   // { id: "2026-11-23" }
let extra = load(KEY_EXTRA, []);
let filter = "all";
let prefFilter = "";
const PREFS = "北海道,青森県,岩手県,宮城県,秋田県,山形県,福島県,茨城県,栃木県,群馬県,埼玉県,千葉県,東京都,神奈川県,新潟県,富山県,石川県,福井県,山梨県,長野県,岐阜県,静岡県,愛知県,三重県,滋賀県,京都府,大阪府,兵庫県,奈良県,和歌山県,鳥取県,島根県,岡山県,広島県,山口県,徳島県,香川県,愛媛県,高知県,福岡県,佐賀県,長崎県,熊本県,大分県,宮崎県,鹿児島県,沖縄県".split(",");
const prefOf = s => PREFS.find(p => (s.address || "").startsWith(p)) || "";
const stores = () => [...window.STORES, ...extra];

const map = L.map("map").setView([36, 137], 5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap contributors", maxZoom: 19 }).addTo(map);
const markers = {};
const layer = L.markerClusterGroup({ maxClusterRadius: 50 }).addTo(map);

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = done => L.divIcon({ className:"", html:`<div class="pin ${done?"done":"todo"}"></div>`, iconSize:[22,22], iconAnchor:[6,22] });

function toggle(id, on) {
  if (on) checked[id] = new Date().toISOString().slice(0,10); else delete checked[id];
  save(KEY_CHECK, checked);
  render();
}

function render() {
  const all = stores();
  const shown = all.filter(s => (filter === "all" || (filter === "done") === !!checked[s.id]) && (!prefFilter || prefOf(s) === prefFilter));
  const cnt = {}, dn = {};
  all.forEach(s => { const p = prefOf(s); cnt[p] = (cnt[p] || 0) + 1; if (checked[s.id]) dn[p] = (dn[p] || 0) + 1; });
  document.getElementById("pref").innerHTML = `<option value="">全国（${all.length}店）</option>` +
    PREFS.filter(p => cnt[p]).map(p => `<option value="${p}" ${p === prefFilter ? "selected" : ""}>${p}（${dn[p] || 0}/${cnt[p]}）</option>`).join("");
  document.getElementById("count").textContent = `取得 ${all.filter(s => checked[s.id]).length} / ${all.length} 店`;
  document.querySelectorAll(".filters button").forEach(b => b.classList.toggle("on", b.dataset.f === filter));

  const list = document.getElementById("list");
  list.innerHTML = "";
  layer.clearLayers();
  shown.forEach(s => {
    const done = !!checked[s.id];
    const el = document.createElement("div");
    el.className = "store" + (done ? " done" : "");
    el.innerHTML = `<input type="checkbox" ${done ? "checked" : ""}>
      <div class="info"><div class="name">${esc(s.name)}</div><div class="addr">${esc(s.address || "")}${s.approx ? "（位置は概算）" : ""}</div>
      ${done ? `<div class="date">受取日: ${esc(checked[s.id])}</div>` : ""}</div>`;
    el.querySelector("input").onchange = e => toggle(s.id, e.target.checked);
    el.querySelector(".info").onclick = () => {
      const m = markers[s.id];
      if (m) layer.zoomToShowLayer(m, () => { map.setView([s.lat, s.lng], Math.max(map.getZoom(), 15)); m.openPopup(); });
    };
    list.appendChild(el);

    const m = L.marker([s.lat, s.lng], { icon: icon(done) }).addTo(layer);
    const pop = document.createElement("div");
    pop.innerHTML = `<b>${esc(s.name)}</b><br>${esc(s.address || "")}<br><label><input type="checkbox" ${done ? "checked" : ""}> 御書印を受け取った</label>`;
    pop.querySelector("input").onchange = e => toggle(s.id, e.target.checked);
    m.bindPopup(pop);
    markers[s.id] = m;
  });
  Object.keys(markers).forEach(k => { if (!layer.hasLayer(markers[k])) delete markers[k]; });
  if (!shown.length) list.textContent = "該当する書店がありません";
}

document.querySelectorAll(".filters button").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });

const menu = document.getElementById("menu"), menuBtn = document.getElementById("menu-btn");
const setMenu = open => { menu.hidden = !open; menuBtn.setAttribute("aria-expanded", open); };
menuBtn.onclick = e => { e.stopPropagation(); setMenu(menu.hidden); };
document.addEventListener("click", e => {
  // 地図のクリックは座標入力に使うので、メニューは開いたままにする
  if (!menu.hidden && !menu.contains(e.target) && !document.getElementById("map").contains(e.target)) setMenu(false);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

document.getElementById("pref").onchange = e => {
  prefFilter = e.target.value;
  render();
  const pts = stores().filter(s => !prefFilter || prefOf(s) === prefFilter).map(s => [s.lat, s.lng]);
  if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 12 });
};

// ---- CSVから書店を追加 ----
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = "";
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
    } else cur += c;
  }
  row.push(cur);
  if (row.some(v => v.trim() !== "")) rows.push(row);
  return rows;
}
function decodeCSV(buf) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch { return new TextDecoder("shift_jis").decode(buf); }   // Excel保存のCSV
}
async function geocode(addr) {
  try {
    const r = await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(addr));
    const d = await r.json();
    if (d[0]) { const [lng, lat] = d[0].geometry.coordinates; return { lat: +lat.toFixed(5), lng: +lng.toFixed(5) }; }
  } catch {}
  return null;
}
const csvStatus = document.getElementById("csv-status");
document.getElementById("csv-btn").onclick = () => document.getElementById("csv-file").click();
document.getElementById("csv-tpl").onclick = e => {
  e.preventDefault();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿書店名,住所,緯度,経度\r\nサンプル書店,東京都千代田区丸の内1-1,35.6812,139.7671\r\n住所だけの書店,東京都千代田区神田神保町1-1,,\r\n"], { type: "text/csv" }));
  a.download = "goshoin-stores-template.csv";
  document.body.appendChild(a); a.click(); a.remove();
};
document.getElementById("csv-file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const rows = parseCSV(decodeCSV(await f.arrayBuffer()));
  const head = (rows[0] || []).map(h => h.trim());
  const col = names => head.findIndex(h => names.includes(h));
  const iName = col(["書店名", "店名", "店舗名称", "name"]), iAddr = col(["住所", "address"]),
        iLat = col(["緯度", "lat", "latitude"]), iLng = col(["経度", "lng", "lon", "longitude"]),
        iPref = col(["都道府県"]), iCity = col(["市町村名"]), iReg = col(["登録番"]);
  if (iName < 0) { csvStatus.textContent = "1行目に「書店名」の見出しが必要です。ひな形を参考にしてください。"; return; }
  const data = rows.slice(1);
  const nfkc = s => (s || "").normalize("NFKC").trim();
  const known = new Set(stores().map(s => s.name + "|" + (s.address || "")));
  const knownIds = new Set(stores().map(s => s.id));
  let added = 0, dup = 0, closed = 0, approx = 0; const bad = [];
  for (let i = 0; i < data.length; i++) {
    const r = data[i], name = nfkc(r[iName]);
    csvStatus.textContent = `処理中… ${i + 1} / ${data.length}`;
    if (!name) continue;
    if (/閉店|受付停止|受付終了/.test(name)) { closed++; continue; }
    const pref = iPref >= 0 ? nfkc(r[iPref]) : "", city = iCity >= 0 ? nfkc(r[iCity]) : "";
    let address = iAddr >= 0 ? nfkc(r[iAddr]).split(/\s+/)[0] : "";   // 「店内」等の補足を除く
    if (address && pref && !address.startsWith(pref)) address = pref + address;
    const reg = iReg >= 0 ? nfkc(r[iReg]) : "";
    const id = reg ? "r" + reg : "x" + Date.now() + "_" + i;
    if (knownIds.has(id) || known.has(name + "|" + address)) { dup++; continue; }
    let lat = iLat >= 0 ? parseFloat(r[iLat]) : NaN, lng = iLng >= 0 ? parseFloat(r[iLng]) : NaN;
    let isApprox = false;
    if (isNaN(lat) || isNaN(lng)) {
      let g = address ? await geocode(address) : null;
      if (!g && (pref || city)) { g = await geocode(pref + city); isApprox = !!g; }   // 住所で見つからなければ市町村の位置
      if (!g) { bad.push(name); continue; }
      ({ lat, lng } = g);
      await new Promise(r => setTimeout(r, 100));
    }
    const s = { id, name, address: address || pref + city, lat, lng };
    if (isApprox) { s.approx = true; approx++; }
    extra.push(s);
    known.add(name + "|" + address); knownIds.add(id); added++;
  }
  save(KEY_EXTRA, extra);
  render();
  csvStatus.textContent = `${added}件を追加しました` + (dup ? `（重複 ${dup}件はスキップ）` : "") +
    (closed ? `、閉店 ${closed}件は除外` : "") + (approx ? `、位置が概算 ${approx}件` : "") +
    (bad.length ? `。位置が分からず追加できなかった店: ${bad.slice(0, 5).join("、")}${bad.length > 5 ? ` ほか${bad.length - 5}件` : ""}` : "");
};

document.getElementById("export").onclick = () => {
  const data = { version: 1, exportedAt: new Date().toISOString(), checked, extra };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = `goshoin-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
document.getElementById("import").onclick = () => document.getElementById("import-file").click();
document.getElementById("import-file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || typeof d.checked !== "object" || Array.isArray(d.checked)) throw new Error("bad");
    const ex = Array.isArray(d.extra) ? d.extra.filter(s => s && s.id && s.name && isFinite(s.lat) && isFinite(s.lng)) : [];
    if (!confirm(`取得 ${Object.keys(d.checked).length} 件、追加書店 ${ex.length} 件を読み込みます。現在の記録とマージします。`)) return;
    Object.entries(d.checked).forEach(([k, v]) => { if (!checked[k]) checked[k] = String(v); });
    ex.forEach(s => { if (!extra.some(x => x.id === s.id)) extra.push({ id: String(s.id), name: String(s.name), address: String(s.address || ""), lat: +s.lat, lng: +s.lng }); });
    save(KEY_CHECK, checked); save(KEY_EXTRA, extra);
    render();
  } catch { alert("読み込めませんでした。書き出したJSONファイルを選んでください。"); }
};
try { navigator.storage?.persist?.(); } catch {}

render();
const pts = stores().map(s => [s.lat, s.lng]);
if (pts.length) map.fitBounds(pts, { padding: [30, 30] });
</script>
</body>
</html>
